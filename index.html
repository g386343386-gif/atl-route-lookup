:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#185FA5;--good:#0F6E56;--warn:#9a6700;--hard:#b42318}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}

const zip=document.getElementById('zip'),dsp=document.getElementById('dsp'),diff=document.getElementById('difficulty');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
[...new Set(DATA.map(x=>x['分配车队']).filter(Boolean))].sort().forEach(v=>dsp.add(new Option(v,v)));
[...new Set(DATA.map(x=>x['Route Difficulty']).filter(Boolean))].sort().forEach(v=>diff.add(new Option(v,v)));
function filtered(){let z=zip.value.trim();return DATA.filter(x=>(!z||String(x['邮编']).includes(z))&&(!dsp.value||x['分配车队']===dsp.value)&&(!diff.value||x['Route Difficulty']===diff.value));}
function render(){const rows=filtered(),z=zip.value.trim();document.getElementById('count').textContent=rows.length;document.getElementById('zipCount').textContent=new Set(rows.map(x=>x['邮编'])).size;document.getElementById('dspCount').textContent=new Set(rows.map(x=>x['分配车队'])).size;document.getElementById('shown').textContent=rows.length+' / '+DATA.length+' records';
document.getElementById('tbody').innerHTML=rows.map(x=>`<tr><td><b>${esc(x['路线'])}</b></td><td>${esc(x['邮编'])}</td><td>${esc(x['城市'])}</td><td><b>${esc(x['分拣码'])}</b></td><td>${esc(x['分配车队'])}</td><td>${esc(x['Route Difficulty'])}</td><td>${esc(x['主要原因'])}</td></tr>`).join('');
let exact=z?DATA.filter(x=>String(x['邮编'])===z):[];const r=document.getElementById('results');if(!z) r.innerHTML='<div class="empty">输入邮编后，这里会显示对应的分拣码和分配车队。</div>'; else if(!exact.length) r.innerHTML='<div class="empty">没有找到邮编 <b>'+esc(z)+'</b> 的分配记录。</div>'; else r.innerHTML=exact.map(x=>`<div class="resultGrid" style="margin-bottom:12px"><div class="kv"><small>路线 / Route</small><strong>${esc(x['路线'])}</strong></div><div class="kv"><small>分拣码 / Sorting Code</small><strong>${esc(x['分拣码'])}</strong></div><div class="kv"><small>分配车队 / DSP</small><strong>${esc(x['分配车队'])}</strong></div><div class="kv"><small>城市</small><strong>${esc(x['城市'])}</strong></div><div class="kv"><small>Route Difficulty</small><strong>${esc(x['Route Difficulty'])}</strong></div><div class="kv"><small>主要原因</small><strong>${esc(x['主要原因'])}</strong></div></div>`).join('');}
[zip,dsp,diff].forEach(el=>el.addEventListener('input',render));render();</script></body></html>
