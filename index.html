:root {
  font-family: Inter, "Segoe UI", "Microsoft YaHei", "Noto Sans SC", sans-serif;

* { box-sizing: border-box; }
body { margin: 0; }
button, input { font: inherit; }
button { cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid #477b79; outline-offset: 2px; }
.topbar {
  min-height: 78px; display: flex; align-items: center; justify-content: space-between;
  padding: 14px clamp(15px, 2.6vw, 38px); background: var(--panel); border-bottom: 1px solid var(--line);
  gap: 12px; flex-wrap: wrap;
}
.brand, .metrics { display: flex; align-items: center; gap: 13px; }
.warehouse {
  background: #234f47; color: #fff; border-radius: 9px; font-size: 0.9rem;
  font-weight: 800; padding: 8px 10px; letter-spacing: .05em;
}
h1 { margin: 0; font-size: clamp(1.18rem, 2vw, 1.55rem); letter-spacing: .01em; }
.metrics { gap: clamp(12px, 2.2vw, 32px); font-size: .88rem; color: var(--muted); }
.metrics span { white-space: nowrap; }
.metrics strong { color: #213d36; font-size: 1.13rem; font-variant-numeric: tabular-nums; }
.workspace {
  height: calc(100dvh - 78px);
  min-height: 610px;
  display: grid; grid-template-columns: 324px minmax(0, 1fr);
}
.sidebar {
  min-height: 0; overflow: auto; padding: 20px 17px; background: var(--panel);
  border-right: 1px solid var(--line); scrollbar-color: #cbd7d2 transparent;
}
.search { position: sticky; top: -20px; z-index: 1; background: #fff; padding: 5px 0 10px; }
.search input {
  width: 100%; height: 44px; border: 1px solid #cfdbd6; border-radius: 8px;
  background: #f7faf8; color: #19352c; padding-inline: 13px; font-size: .91rem;
}
.search input::placeholder { color: #586a65; }
.section-heading { display: flex; justify-content: space-between; align-items: center; margin: 13px 0 9px; gap: 8px; }
h2 { font-size: .99rem; margin: 0; }
.section-heading span { color: var(--muted); font-size: .84rem; }
.fleets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.fleet, .route {
  border: 1px solid var(--line); color: #273831; background: #fff; border-radius: 7px;
  display: flex; align-items: center; text-align: left; min-width: 0;
}
.fleet { justify-content: space-between; gap: 3px; min-height: 34px; padding: 5px 7px; }
.fleet:hover, .route:hover { background: #f4f8f6; border-color: #a2bab1; }
.fleet[aria-pressed="true"], .route[aria-pressed="true"] { background: #eaf3ee; border-color: #77a290; }
.fleet.all, .fleet.long { grid-column: 1 / -1; }
.fleet-name { display: flex; align-items: center; min-width: 0; gap: 6px; font-size: .81rem; font-weight: 700; }
.dot { flex: 0 0 9px; height: 9px; border-radius: 50%; background: var(--dsp, #43695c); }
.fleet-count { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.route-section { border-top: 1px solid var(--line); margin-top: 17px; padding-top: 2px; }

.empty { margin: 9px 0; color: var(--muted); font-size: .88rem; }
.map-frame { position: relative; display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; }
#map { min-height: 360px; z-index: 0; background: #e7ece8; font-family: inherit; }
.base-tiles { filter: saturate(.30) contrast(.86) brightness(1.13); }
.map-tools {

<script>
"use strict";

const colors = {
  ALC: "#21885a", MOV: "#ce6744", PCG: "#8564bf", ULT: "#807451",
  DEF: "#2383a4", RIX: "#cb5092", CANDO: "#9279b2", PROS: "#9c715f",
  HYPER: "#bf992a", JPA: "#3f65ce", "777": "#a5404b", LNS: "#309087",
  联合车队: "#808746", SEVEN: "#ad5481", JONES: "#a36e24",
  EBGENERAL: "#4189d0", XUTRANSPORTATION: "#625aae",
};
const neutralRouteColor = "#6e7974";
const $ = (id) => document.getElementById(id);
const map = L.map("map", { zoomSnap: 0.25, zoomDelta: 0.75, minZoom: 6, maxZoom: 17 })
  .setView([33.9, -84.27], 9);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxNativeZoom: 18,
  className: "base-tiles",
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
}).addTo(map);
map.attributionControl.setPrefix(false);
map.getContainer().setAttribute("aria-label", "ATL 配送区域地图，使用加减键缩放");
const shapes = L.layerGroup().addTo(map);
const labels = L.layerGroup().addTo(map);
const pins = L.layerGroup().addTo(map);
const state = { dsp: "", difficulty: "", route: null, labels: true, query: "" };
const entries = new Map();
const warehouseLocation = L.latLng(33.918671903163, -84.213473389025);
const metersPerMile = 1609.344;
const buttons = new Map();
const routeButtons = new Map();
let routes = [];
let filtered = [];
let active = [];
let searchTimer;

function node(tag, text, className) {
  const element = document.createElement(tag);
  if (text != null) element.textContent = text;
  if (className) element.className = className;
  return element;
}

function addWarehouseMarker() {
  const address = "6170 Brook Hollow Parkway, Norcross, GA 30071";
  const popup = node("div", null, "map-popup warehouse-popup");
  popup.append(node("h3", "ATL 仓库"), node("p", address));
  const marker = L.marker(warehouseLocation, {
    title: "ATL 仓库",
    zIndexOffset: 3500,
    icon: L.divIcon({
      html: node("span", "仓"),
      className: "warehouse-pin",
      iconSize: [30, 30],
      iconAnchor: [15, 34],
      popupAnchor: [0, -31],
    }),
  }).addTo(map).bindPopup(popup);
  marker.getElement().setAttribute("aria-label", "ATL 仓库，" + address);
  $("locate-warehouse").addEventListener("click", () => {
    map.setView(warehouseLocation, 14, { animate: false });
    marker.openPopup();
  });
}

function updateNotice(message) {
  $("notice").textContent = message;
  $("notice").hidden = !message;
}

function makePopup(route, boundary) {
  const section = node("div", null, "map-popup");
  const heading = node("h3", route.route);
  heading.style.color = "#1e3e36";
  section.append(heading, node("p", route.city));
  const details = node("dl");
  const values = {
    DSP: route.dsp,
    分拣码: route.sort,
    ZIP: route.zips.join("、"),
  };
  for (const [name, value] of Object.entries(values)) {
    details.append(node("dt", name), node("dd", value));
  }
  const postalAreas = entries.get(route.id);
  const distances = node("dd");
  for (const area of postalAreas) {
    const distance = area.anchor
      ? `${(warehouseLocation.distanceTo(area.anchor) / metersPerMile).toFixed(1)} miles`
      : "暂无坐标";
    const label = postalAreas.length > 1 ? `${area.zip} · ${distance}` : distance;
    distances.append(node("div", label));
  }
  details.append(node("dt", "距仓库（直线）"), distances);
  section.append(details);
  const difficulty = node("section", null, "popup-difficulty");
  difficulty.append(node("h4", `Route Difficulty：${route.difficultyLevel}`), node("p", route.difficultyReason));
  section.append(difficulty);
  if (!boundary) section.append(node("p", "该邮编没有 ZCTA 边界，地图显示近似位置。", "point-note"));
  return section;
}

function styleEntry(entry) {
  const selected = state.route === entry.route.id;
  const color = selected ? entry.color : neutralRouteColor;
  return {
    color, weight: selected ? 3 : 1.1, opacity: selected ? 1 : 0.55,
    fillColor: color, fillOpacity: selected ? 0.63 : 0,
    className: "route-shape",
  };
}

function stylePin(entry) {
  const selected = state.route === entry.route.id;
  const color = selected ? entry.color : neutralRouteColor;
  return { color, fillColor: color, fillOpacity: selected ? 0.8 : 0.35 };
}

function openEntry(entry, at = entry.anchor) {
  if (!at) return;
  L.popup({ maxWidth: 285 })
    .setLatLng(at)
    .setContent(makePopup(entry.route, Boolean(entry.shape)))
    .openOn(map);
}

function makeEntry(route, zip, boundary, point) {
  const entry = { route, zip, color: colors[route.dsp], anchor: boundary?.anchor || point };
  if (boundary) {
    entry.shape = L.geoJSON(boundary.geometry, {
      style: () => styleEntry(entry),
      onEachFeature(_, layer) {
        layer.on("add", () => {
          const path = layer.getElement();
          if (!path) return;
          path.setAttribute("tabindex", "0");
          path.setAttribute("role", "button");
          path.setAttribute("aria-label", `${route.route} · ${route.dsp} · ZIP ${zip}`);
          path.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            selectRoute(route.id, entry, entry.anchor, false);
          });
        });
      },
    }).on("click", (event) => selectRoute(route.id, entry, event.latlng, false));
  } else if (point) {
    entry.pin = L.circleMarker(point, {
      ...stylePin(entry), radius: 6, dashArray: "2 2", weight: 2,
    }).on("click", () => selectRoute(route.id, entry, point, false));
  }
  return entry;
}

function fit(entriesToShow, maxZoom = 12) {
  const bounds = L.latLngBounds([]);
  for (const entry of entriesToShow) {
    if (entry.shape) bounds.extend(entry.shape.getBounds());
    else if (entry.anchor) bounds.extend(entry.anchor);
  }
  if (!bounds.isValid()) return false;
  map.fitBounds(bounds, { paddingTopLeft: [26, 66], paddingBottomRight: [26, 25], maxZoom, animate: false });
  return true;
}

function renderLabels() {
  labels.clearLayers();
  if (!state.labels) return;
  const used = [];
  const viewport = map.getSize();
  const candidates = active.filter((entry) => entry.anchor);
  const priority = (entry) => (entry.route.id === state.route ? 2 : Number(["A01", "A02", "B01"].includes(entry.route.route)));
  candidates.sort((a, b) => priority(b) - priority(a));
  const showingRoutes = new Set();
  for (const entry of candidates) {
    const selected = state.route === entry.route.id;
    if (!selected && map.getZoom() < 11 && showingRoutes.has(entry.route.id)) continue;
    const { x, y } = map.latLngToContainerPoint(entry.anchor);
    if (x < 0 || y < 0 || x > viewport.x || y > viewport.y) continue;
    const width = entry.route.route.length > 3 ? 40 : 32;
    const offsets = priority(entry) ? [0, -9, 9, -15, 15] : [0];
    let box;
    const offset = offsets.find((dy) => {
      box = [x - width / 2, y + dy - 9, x + width / 2, y + dy + 9];
      return !used.some(([l, t, r, b]) => box[0] < r && box[2] > l && box[1] < b && box[3] > t);
    });
    if (offset === undefined) continue;
    used.push(box);
    showingRoutes.add(entry.route.id);
    const text = node("span", entry.route.route);
    text.style.setProperty("--dsp", selected ? entry.color : neutralRouteColor);
    const icon = L.divIcon({
      html: text, iconSize: [0, 0], iconAnchor: [0, -offset],
      className: `route-label${selected ? " selected" : ""}${entry.shape ? "" : " point"}`,
    });
    L.marker(entry.anchor, { icon, keyboard: false, zIndexOffset: selected ? 1500 : 1000 })
      .on("click", () => selectRoute(entry.route.id, entry, entry.anchor, false))
      .addTo(labels);
  }
}

function selectRoute(id, entry, position, focusMap) {
  state.route = id;
  updateNotice("");
  for (const [routeId, button] of routeButtons) {
    button.setAttribute("aria-pressed", String(routeId === id));
  }
  for (const item of active) {
    item.shape?.setStyle(styleEntry(item));
    item.pin?.setStyle(stylePin(item));
    if (item.route.id === id) {
      item.shape?.bringToFront();
      item.pin?.bringToFront();
    }
  }
  if (id == null) {
    map.closePopup();
    renderLabels();
    return;
  }
  const routeEntries = entries.get(id);
  if (focusMap) {
    map.closePopup();
    fit(routeEntries, 13);
  }
  renderLabels();
  const popupEntry = entry || routeEntries.find((item) => item.anchor);
  if (popupEntry) openEntry(popupEntry, position ?? popupEntry.anchor);
  else updateNotice("该路线的邮编暂无可定位的边界或坐标。");
}

function addFleet(id, count) {
  const button = node("button", null, "fleet");
  button.type = "button";
  if (!id) button.classList.add("all");
  if (id.length > 12) button.classList.add("long");
  button.style.setProperty("--dsp", colors[id] || "#365c50");
  const label = node("span", null, "fleet-name");
  label.append(node("i", null, "dot"), node("span", id || "全部 DSP"));
  button.append(label, node("span", count, "fleet-count"));
  button.setAttribute("aria-label", `${id || "全部 DSP"}，${count} 条路线`);
  button.addEventListener("click", () => {
    state.dsp = state.dsp === id ? "" : id;
    renderFiltered(true);
  });
  buttons.set(id, button);
  $("fleets").append(button);
}

function routeButton(route) {
  const button = node("button", null, "route");
  button.type = "button";
  button.style.setProperty("--dsp", colors[route.dsp]);
  button.setAttribute("aria-label", `${route.route}，${route.dsp}，邮编 ${route.zips.join("、")}`);
  button.setAttribute("aria-pressed", "false");
  button.append(node("i", null, "dot"), node("strong", route.route),
    node("small", route.zips.join(" · ")),
    node("em", entries.get(route.id).some((entry) => !entry.shape) ? "缺边界" : ""));
  button.addEventListener("click", () => {
    selectRoute(state.route === route.id ? null : route.id, null, null, true);
  });
  routeButtons.set(route.id, button);
  return button;
}

function renderFiltered(refit) {
  state.route = null;
  map.closePopup();
  for (const [dsp, button] of buttons) button.setAttribute("aria-pressed", String(dsp === state.dsp));
  const query = state.query.toUpperCase().trim();
  filtered = routes.filter((route) => (!state.dsp || route.dsp === state.dsp)
    && (!state.difficulty || route.difficultyLevel === state.difficulty)
    && (!query || [route.route, route.sort, route.dsp, ...route.zips].some((value) => value.toUpperCase().includes(query))));
  active = filtered.flatMap((route) => entries.get(route.id));
  const zipCount = new Set(active.map((entry) => entry.zip)).size;
  $("selection-count").textContent = `${filtered.length} 条`;
  $("coverage").textContent = `${active.filter((entry) => entry.shape).length} / ${zipCount} 个 ZIP 有边界`;
  routeButtons.clear();
  const list = document.createDocumentFragment();
  for (const route of filtered) list.append(routeButton(route));
  if (!filtered.length) list.append(node("p", "没有匹配的路线。", "empty"));
  $("route-list").replaceChildren(list);
  shapes.clearLayers();
  pins.clearLayers();
  for (const entry of active) {
    if (entry.shape) shapes.addLayer(entry.shape.setStyle(styleEntry(entry)));
    if (entry.pin) pins.addLayer(entry.pin.setStyle(stylePin(entry)));
  }
  if (refit) fit(active, state.dsp || state.difficulty || query ? 12 : 10.5);
  renderLabels();
  updateNotice(filtered.length ? "" : "没有匹配的路线。");
}

function start() {
  const data = JSON.parse($("route-data").textContent);
  routes = data.routes.sort((a, b) => a.route.localeCompare(b.route, "en", { numeric: true }));
  const counts = new Map();
  const zipCodes = new Set();
  for (const route of routes) {
    if (!colors[route.dsp]) throw new Error(`Missing fleet color for ${route.dsp}`);
    counts.set(route.dsp, (counts.get(route.dsp) || 0) + 1);
    for (const zip of route.zips) zipCodes.add(zip);
    entries.set(route.id, route.zips.map((zip) => makeEntry(route, zip, data.boundaries[zip], data.points[zip])));
  }
  $("route-count").textContent = routes.length;
  $("zip-count").textContent = zipCodes.size;
  $("dsp-count").textContent = counts.size;
  addFleet("", routes.length);
  addWarehouseMarker();
  for (const [dsp, count] of [...counts].sort(([a, c], [b, d]) => d - c || a.localeCompare(b))) {
    addFleet(dsp, count);
  }
  $("query").addEventListener("input", (event) => {
    state.query = event.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => renderFiltered(true), 140);
  });
  $("fit").addEventListener("click", () => fit(active));
  const difficultyButtons = $("difficulty-options").querySelectorAll("button");
  for (const button of difficultyButtons) {
    button.addEventListener("click", () => {
      state.difficulty = button.dataset.level;
      $("difficulty-summary").textContent = state.difficulty ? `筛选难度 · ${state.difficulty}` : "筛选难度";
      for (const option of difficultyButtons) option.setAttribute("aria-pressed", String(option === button));
      renderFiltered(true);
    });
  }
  $("labels").addEventListener("click", () => {
    state.labels = !state.labels;
    $("labels").setAttribute("aria-pressed", String(state.labels));
    renderLabels();
  });
  map.on("moveend resize", renderLabels);
  renderFiltered(true);
}

try {
  start();
} catch (error) {
  console.error(error);
  updateNotice("路线地图加载失败，请刷新页面后重试。");
}

</script>
</body>
</html>
